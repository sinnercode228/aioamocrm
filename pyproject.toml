[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aioamocrm"
version = "0.1.0"
description = "Async client for the amoCRM / Kommo API v4: OAuth2 with token rotation, rate limiting, retries, pagination, typed models and webhook parsing"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "sinnercode228" }]
keywords = ["amocrm", "kommo", "crm", "api", "asyncio", "httpx", "oauth2", "webhooks"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: AsyncIO",
  "Framework :: Pydantic :: 2",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.25,<1", "pydantic>=2.5,<3"]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.11",
  "pytest>=8.2",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "ruff>=0.6",
  "twine>=6.1",
]

[project.urls]
Homepage = "https://github.com/sinnercode228/aioamocrm"
Source = "https://github.com/sinnercode228/aioamocrm"
Issues = "https://github.com/sinnercode228/aioamocrm/issues"
Changelog = "https://github.com/sinnercode228/aioamocrm/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/aioamocrm"]

[tool.hatch.build.targets.sdist]
include = ["src/aioamocrm", "tests", "examples", "CHANGELOG.md", "README.md", "LICENSE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["aioamocrm"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = ["if TYPE_CHECKING:", "\\.\\.\\.$", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF", "S", "PT", "RET", "C4", "PL",
  "D", "ANN", "TID", "T20", "LOG", "G", "DTZ", "PIE", "PERF", "FBT",
]
# ANN401: JSON bodies and payloads are typed as Any on purpose.
ignore = ["D203", "D213", "D105", "D107", "PLR0913", "FBT001", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "PLR2004", "D", "PLC0415", "FBT", "ASYNC240"]
"examples/**" = ["D", "S105", "PLR2004", "T201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
files = ["src"]
